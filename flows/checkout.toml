# Flightplan flow — end-to-end checkout on the "window-shop-dovid-test" agentic storefront (UAT).
#
# Authored by translating a live browser-pilot exploration of https://uat-ws-pilot-web.api-swap-os.com
# /window-shop-dovid-test (a chat-driven "window shop" storefront, not a classic click-through PDP
# grid): go straight to a known product's chat/PDP URL, pick a size, add to cart, go to checkout,
# fill checkout/shipping/payment, pay with an Adyen test card, and assert the "Payment Successful!"
# screen. No browser-pilot `ref:eN` values are persisted here — every target below was translated
# to a durable CSS/attribute selector (checked live with `bp diagnose`) plus a natural-language
# fallback anchor, and `[config.ai].max_model_calls = 0` keeps resolution deterministic (L0/L1
# only) so a missing optional overlay fails its step FAST instead of paying for an AI escalation.
#
# Notable non-obvious selectors, discovered live (see PR/session notes):
#   - Direct-navigating to the PDP chat URL (`/chat/products/<shopify-gid-base64>`) reproduces the
#     exact destination landed on after searching "jacket" and clicking the Olive Green Jacket
#     result, without the composer-submit/agent-search round trip that used to precede it.
#   - The PDP size selector renders one button per size, all sharing
#     `[data-testid='pdp-controls-size']` with no distinguishing attribute beyond visible text, so
#     `:nth-of-type` (1=XS 2=S 3=M 4=L 5=XL) is the only durable disambiguator; `size_index` is an
#     input so the size can be changed without touching step targets.
#   - The address field is backed by a Google Places autocomplete widget; suggestions render as
#     `button` elements with the full suggestion string as their accessible name.
#   - Payment fields are Adyen Secured Fields inside cross-origin iframes titled "Iframe for card
#     number" / "Iframe for expiry date" / "Iframe for security code". Each iframe contains a
#     hidden `#shiftTabField` FIRST, so a bare `input` selector hits the wrong element — the real
#     field is `input[id^='adyen-checkout-encrypted...']`.

version = 1
kind = "flow"
id = "swap.window_shop_checkout"
description = "Open a product directly, add to cart, and pay on window-shop-dovid-test, asserting Payment Successful"

[inputs]
base_url = "https://uat-ws-pilot-web.api-swap-os.com/window-shop-dovid-test"
# Navigate straight to the product's chat/PDP URL instead of driving the chat-search composer.
# This was found live via `bp diagnose`/click-through, is stable (a Shopify GID-derived path), and
# removes the flakiest, slowest part of the flow (composer submit + waiting on chat-agent search
# results) in favor of one deterministic `goto`.
product_url = "https://uat-ws-pilot-web.api-swap-os.com/window-shop-dovid-test/chat/products/Z2lkOi8vc2hvcGlmeS9Qcm9kdWN0LzE1NDU4NjIwMjExNTgz"
product_title = "Olive Green Jacket"
# 3 = M in the PDP size list (1=XS 2=S 3=M 4=L 5=XL). Kept as an input so a size swap does not
# require touching step targets; task guidance is "prefer M, else any available size" — this flow
# targets M directly since M was confirmed available for the chosen product during authoring.
size_index = "3"

customer_name = "Jan Siml"
customer_email = "jan@swap-commerce.com"
# `fill` REPLACES the whole field value rather than appending after the pre-seeded "+44 " prefix,
# so the full E.164-style number (with its own "+44") is supplied directly — typing just the
# national number let the widget's own formatter misread the leading "7" as a +7 (Russia) country
# code once already.
customer_phone = "+447881122333"
# Typed into the Google-Places-backed address field; a short, unambiguous prefix is enough since
# the flow accepts whichever suggestion the widget offers first (see `select_address_suggestion`).
address_query = "1 Tottenham Court"

card_number = "5555444433331111"
card_expiry = "0330"
card_cvc = "737"

[run]
max_steps = 40
assertions = "eager"
assert_timeout_ms = 8000

# Pin the L5 path-repair planner OFF for a deterministic, byte-stable happy path.
[config.plan]
enabled = false

# Every target below has a durable CSS/attribute selector as its FIRST locator, so most steps
# resolve at L0/L1 without a model call. A hard `max_model_calls = 0` cap was tried here but proved
# unsafe for the optional onboarding-overlay steps (cookie/guide/region): when one of those overlays
# is ABSENT, the resolver's "is this really gone" check needs a bounded L2 escalation rather than an
# instant miss, and a zero budget turns that into a hard `budget exceeded` runner error that bypasses
# `on_fail` entirely (a budget ceiling is fail-closed and propagates, by design — it is not a normal
# step failure). A small non-zero budget keeps the flow deterministic on the mutating happy path
# (add-to-cart, checkout, payment all resolve at L0/L1 and never touch this budget) while letting the
# optional overlay probes escalate a little before giving up.
[config.ai]
max_model_calls = 12

# Launch a fresh, dedicated Chrome instance rather than attaching to whatever CDP endpoint an
# ambient `bp connect` session happens to expose — this flow owns its browser end to end.
[config.connect]
mode = "launch"
headless = false

[config.browser]
record = true

# --------------------------------------------------------------------------------------------
# 0. Navigate straight to the product page and dismiss whatever onboarding overlays appear.
# --------------------------------------------------------------------------------------------

# `goto` the PDP chat URL directly rather than driving the chat-search composer: it is the exact
# URL landed on after searching "jacket" and clicking the Olive Green Jacket result during
# authoring, so it reproduces the same destination deterministically and in one step, without the
# composer-submit/agent-search round trip.
[[steps]]
id = "open_product"
do = "goto"
url = "${inputs.product_url}"

# The onboarding overlays below are each OPTIONAL: on a fresh browser profile the sequence is
# cookie consent -> a 2-page "welcome guide" tour -> a "Where are you shopping from?" region
# picker, each stacked on top of the (inert) product page; on a returning profile none of them
# render at all. Each step's `on_fail = { goto = ..., max = 1 }` makes it a no-op fallthrough to
# the next one instead of failing the run when its target is absent — the chain always ends at
# `product_page_ready`, whether zero, some, or all three overlays appeared.
[[steps]]
id = "accept_cookies"
do = "click"
effect = "idempotent"
target = ["role:button:Accept all", "the Accept all button in the cookie consent banner"]
on_fail = { goto = "dismiss_welcome_guide", max = 1 }

[[steps.assert]]
type = "hidden"
text = "Cookie preferences"
purpose = "postcondition"
timeout_ms = 4000

# Confirmed durable selector (per live inspection): `[data-testid='welcome-guide-dismiss']` is the
# guide's own Skip control, unlike the tour's plain "Skip" TEXT which is not unique/stable across
# the tour's pages.
[[steps]]
id = "dismiss_welcome_guide"
do = "click"
effect = "idempotent"
target = ["[data-testid='welcome-guide-dismiss']", "the Skip button on the welcome guide overlay"]
on_fail = { goto = "select_shipping_region", max = 1 }

[[steps.assert]]
type = "hidden"
text = "Meet the agent"
purpose = "postcondition"
timeout_ms = 4000

[[steps]]
id = "select_shipping_region"
do = "click"
effect = "idempotent"
target = ["role:button:United Kingdom", "the United Kingdom option in the region picker"]
on_fail = { goto = "recheck_cookies", max = 1 }

# Both the cookie-consent dialog and the welcome-guide tour have been observed (in UAT) to
# hydrate LATE — up to ~5s after page load — i.e. AFTER the dismissal chain above has already run
# and skipped them as absent. Re-check both here, right before the flow starts clicking real page
# controls, so a late-rendering overlay gets dismissed instead of silently covering (and failing)
# a later click.
[[steps]]
id = "recheck_cookies"
do = "click"
effect = "idempotent"
target = ["role:button:Accept all", "the Accept all button in the cookie consent banner"]
on_fail = { goto = "recheck_welcome_guide", max = 1 }

[[steps.assert]]
type = "hidden"
text = "Cookie preferences"
purpose = "postcondition"
timeout_ms = 4000

[[steps]]
id = "recheck_welcome_guide"
do = "click"
effect = "idempotent"
target = ["[data-testid='welcome-guide-dismiss']", "the Skip button on the welcome guide overlay"]
on_fail = { goto = "recheck_shipping_region", max = 1 }

[[steps.assert]]
type = "hidden"
text = "Meet the agent"
purpose = "postcondition"
timeout_ms = 4000

# The "Where are you shopping from?" region picker has also been observed to hydrate LATE — after
# the first `select_shipping_region` attempt above already ran and found nothing to click — so it
# is re-checked here too, right before the flow starts driving real page controls.
[[steps]]
id = "recheck_shipping_region"
do = "click"
effect = "idempotent"
target = ["role:button:United Kingdom", "the United Kingdom option in the region picker"]
on_fail = { goto = "product_page_ready", max = 1 }

[[steps.assert]]
type = "hidden"
text = "Where are you shopping from?"
purpose = "postcondition"
timeout_ms = 4000

[[steps]]
id = "product_page_ready"
do = "assert"

[[steps.assert]]
type = "visible"
text = "${inputs.product_title}"
purpose = "postcondition"
timeout_ms = 10000

[[steps.assert]]
type = "visible"
text = "Add to cart"
purpose = "postcondition"
timeout_ms = 10000

# --------------------------------------------------------------------------------------------
# 2. Pick a size and add the product to the cart.
# --------------------------------------------------------------------------------------------

[[steps]]
id = "expand_size_selector"
do = "click"
effect = "idempotent"
target = [
  "role:button:Color: Olive Green · Size: XS",
  "the color and size selector toggle on the product card",
]

[[steps.assert]]
type = "visible"
selector = "[data-testid='pdp-controls-size']"
purpose = "postcondition"
timeout_ms = 4000

[[steps]]
id = "select_size"
do = "click"
effect = "idempotent"
target = [
  "[data-testid='pdp-controls-size']:nth-of-type(${inputs.size_index})",
  "the M size option on the product card",
]

[[steps.assert]]
type = "text"
text = "Size: M"
match = "contains"
purpose = "postcondition"
timeout_ms = 4000

[[steps]]
id = "add_to_cart"
do = "click"
effect = "at_most_once"
retry = { policy = "never" }
target = ["role:button:Add to cart", "the Add to cart button on the product card"]

[[steps.assert]]
type = "visible"
text = "Added to cart"
purpose = "postcondition"
timeout_ms = 8000

[[steps.assert]]
type = "visible"
text = "View cart (1)"
purpose = "postcondition"
timeout_ms = 8000

# --------------------------------------------------------------------------------------------
# 3. Open the cart drawer and go to checkout.
# --------------------------------------------------------------------------------------------

# The header cart icon only shows a tooltip on hover/click — it does not open the cart drawer.
# The reliable path to the drawer is the "View cart (N)" link inside the "Added to cart" toast
# that appears immediately after `add_to_cart` (confirmed live: clicking the header icon left the
# `cart-checkout-button` assertion below timing out with no matching element).
[[steps]]
id = "open_cart"
do = "click"
effect = "idempotent"
target = ["role:link:View cart (1)", "the View cart link in the Added to cart toast"]

[[steps.assert]]
type = "visible"
selector = "[data-testid='cart-checkout-button']"
purpose = "postcondition"
timeout_ms = 6000

[[steps]]
id = "go_to_checkout"
do = "click"
effect = "idempotent"
target = ["[data-testid='cart-checkout-button']", "the Go to checkout button in the cart drawer"]

[[steps.assert]]
type = "url"
url = "${inputs.base_url}/checkout"
match = "origin_path"
purpose = "postcondition"
timeout_ms = 8000

[[steps.assert]]
type = "visible"
selector = "[placeholder=\"Enter your full name*\"]"
purpose = "postcondition"
timeout_ms = 8000

# --------------------------------------------------------------------------------------------
# 4. Checkout details: name, address (via the Places autocomplete), email, phone.
# --------------------------------------------------------------------------------------------

[[steps]]
id = "fill_full_name"
do = "fill"
effect = "idempotent"
target = ["[placeholder=\"Enter your full name*\"]", "the Full name field"]
value = "${inputs.customer_name}"

# This is a test order, so the address only needs to be plausible: type a short prefix and accept
# whichever Places suggestion the widget offers first, rather than typing and matching a full,
# exact address string (which drifted once already — the widget can phrase a suggestion as
# "Court Road" vs. the typed "Ct Rd", among other paraphrases).
[[steps]]
id = "fill_address"
do = "fill"
effect = "idempotent"
target = ["[placeholder=\"Enter street name and number*\"]", "the Address field"]
value = "${inputs.address_query}"

[[steps.assert]]
type = "visible"
text = "London"
purpose = "postcondition"
timeout_ms = 6000

# Select the FIRST Places suggestion via the keyboard (ArrowDown highlights it, Enter accepts it)
# rather than clicking a specific suggestion by its exact text — the suggestion list has no shared
# `data-testid`/class to target positionally, and its wording is not guaranteed stable, so the
# keyboard is the durable, address-agnostic way to "accept the first Places match". Focus stays on
# the address input after `fill`, so no explicit `click` is needed before these key presses.
[[steps]]
id = "select_address_suggestion"
do = "press"
effect = "idempotent"
key = "ArrowDown"

[[steps]]
id = "accept_address_suggestion"
do = "press"
effect = "idempotent"
key = "Enter"

[[steps.assert]]
type = "text"
text = "United Kingdom"
match = "contains"
purpose = "postcondition"
timeout_ms = 6000

[[steps]]
id = "fill_email"
do = "fill"
effect = "idempotent"
target = ["css:input[type='email']", "the Email address field"]
value = "${inputs.customer_email}"

[[steps]]
id = "fill_phone"
do = "fill"
effect = "idempotent"
target = ["css:input[type='tel']", "the Phone number field"]
value = "${inputs.customer_phone}"

[[steps]]
id = "continue_to_shipping"
do = "click"
effect = "idempotent"
target = ["role:button:Continue to shipping", "the Continue to shipping button"]

[[steps.assert]]
type = "visible"
text = "Continue to Payment"
purpose = "postcondition"
timeout_ms = 8000

# --------------------------------------------------------------------------------------------
# 5. Shipping: pick the free standard option and continue to payment.
# --------------------------------------------------------------------------------------------

[[steps]]
id = "select_shipping"
do = "click"
effect = "idempotent"
target = [
  "role:radio:Standard Shipping (Free Shipping), Standard delivery, FREE",
  "the Standard Shipping (Free Shipping) delivery option",
]

[[steps]]
id = "continue_to_payment"
do = "click"
effect = "idempotent"
target = ["role:button:Continue to Payment", "the Continue to Payment button"]

[[steps.assert]]
type = "visible"
text = "Card number"
purpose = "postcondition"
timeout_ms = 8000

# --------------------------------------------------------------------------------------------
# 6. Payment: Adyen Secured Fields (each is a cross-origin iframe; enter/leave per field). The
#    hidden `#shiftTabField` is always the FIRST input in each iframe, so the real field is
#    targeted by its `adyen-checkout-encrypted*` id prefix, never a bare `input` selector.
# --------------------------------------------------------------------------------------------

[[steps]]
id = "enter_card_number_frame"
do = "switch_frame"
effect = "observe"
target = ["css:iframe[title='Iframe for card number']", "the card number payment iframe"]

[[steps]]
id = "fill_card_number"
do = "fill"
effect = "idempotent"
secret = true
target = ["css:input[id^='adyen-checkout-encryptedCardNumber']", "the card number field"]
value = "${inputs.card_number}"

[[steps]]
id = "leave_card_number_frame"
do = "switch_to_main"
effect = "observe"

[[steps]]
id = "enter_expiry_frame"
do = "switch_frame"
effect = "observe"
target = ["css:iframe[title='Iframe for expiry date']", "the expiry date payment iframe"]

[[steps]]
id = "fill_expiry"
do = "fill"
effect = "idempotent"
target = ["css:input[id^='adyen-checkout-encryptedExpiryDate']", "the expiry date field"]
value = "${inputs.card_expiry}"

[[steps]]
id = "leave_expiry_frame"
do = "switch_to_main"
effect = "observe"

[[steps]]
id = "enter_cvc_frame"
do = "switch_frame"
effect = "observe"
target = ["css:iframe[title='Iframe for security code']", "the security code payment iframe"]

[[steps]]
id = "fill_cvc"
do = "fill"
effect = "idempotent"
secret = true
target = ["css:input[id^='adyen-checkout-encryptedSecurityCode']", "the security code field"]
value = "${inputs.card_cvc}"

[[steps]]
id = "leave_cvc_frame"
do = "switch_to_main"
effect = "observe"

[[steps.assert]]
type = "state"
state = "enabled"
selector = "button.adyen-checkout__button--pay"
purpose = "precondition"
timeout_ms = 6000

# The final at-most-once mutation: submit payment. No self-retry — a click that dispatches must
# never be re-entered.
[[steps]]
id = "pay"
do = "click"
effect = "at_most_once"
retry = { policy = "never" }
target = ["button.adyen-checkout__button--pay", "the Pay button"]

[[steps.assert]]
type = "text"
selector = "h2"
text = "Payment Successful!"
match = "exact"
purpose = "postcondition"
timeout_ms = 20000
