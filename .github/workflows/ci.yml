name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Flightplan
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Verify browser-pilot boundary
        run: |
          bun run verify:browser-pilot
          bun run verify:browser-pilot:packed
