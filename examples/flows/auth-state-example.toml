# Flightplan example flow — [config.auth] saved cookie state (browser-pilot cookie snapshots).
#
# This flow is a schema/documentation example, not a runnable fixture: it reuses the /wizard
# fixture's happy path so it lints and (with the fixture server running) runs cleanly, while
# demonstrating the `cookie_file` / `cookie_save` shape. Point `cookie_file` at a real snapshot
# produced by `bp env auth save <name>` (browser-pilot ^0.6.0), and never commit the resulting
# file — gitignore `*.cookies.json`.
#
# Fixture contract: ../fixtures/README.md §01 (same page as wizard.toml).

version = 1
kind = "flow"
id = "examples.auth_state"
description = "Restore a saved cookie snapshot, log in only if needed, then complete the wizard"

[inputs]
base_url = "http://localhost:3000"
full_name = "Jane Doe"

[run]
max_steps = 20
assertions = "eager"
assert_timeout_ms = 5000

# Pin the L5 path-repair planner OFF (matches the code default) so deterministic runs stay
# byte-stable regardless of ambient AI config. Behavioral no-op — the planner is opt-in.
[config.plan]
enabled = false

# --- warm-cache mode: restore a saved cookie snapshot right after connect(), before any
# navigation. `cookie_save = true` means a missing/expired/empty snapshot is only a warning
# (restore is skipped and the flow below is expected to log in on its own); on a SUCCESSFUL
# run the snapshot is recaptured and the file overwritten before teardown. Path is resolved
# relative to this flow file's directory. Requires browser-pilot ^0.6.0 on a Node/Bun host —
# MockDriver and worker hosts never touch the file.
[config.auth]
cookie_file = "../fixtures/wizard.cookies.json"  # never commit; treat as a live credential
cookie_save = true

[[steps]]
id = "open_wizard"
do = "goto"
url = "${inputs.base_url}/wizard"

# "Restored ≠ logged in" — assert on real page state instead of trusting the snapshot.
[[steps.assert]]
type = "visible"
text = "Full name"

[[steps]]
id = "enter_name"
do = "fill"
effect = "at_most_once"
target = ["[data-testid='wizard-name']", "the full name field"]
value = "${inputs.full_name}"

[[steps.assert]]
type = "value"
selector = "[data-testid='wizard-name']"
value = "${inputs.full_name}"
