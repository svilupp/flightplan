# Flightplan example flow — [config.auth] wiring for a target behind Cloudflare Access.
#
# This flow is a schema/documentation example, not a runnable fixture: it reuses the /wizard
# fixture's happy path so it lints and (with the fixture server running) runs cleanly, while
# demonstrating every `[config.auth]` shape. Point `config.auth.cf_access.url` and the
# `[[config.auth.cookies]]` `domain` at your real Access-protected origin, and set the env vars
# named below (never literal secrets in the flow file itself).
#
# Fixture contract: ../fixtures/README.md §01 (same page as wizard.toml).

version = 1
kind = "flow"
id = "examples.cf_access"
description = "Authenticate through Cloudflare Access, then complete the wizard"

[inputs]
base_url = "http://localhost:3000"
full_name = "Jane Doe"

[run]
max_steps = 20
assertions = "eager"
assert_timeout_ms = 5000

# Pin the L5 path-repair planner OFF (matches the code default) so deterministic runs stay
# byte-stable regardless of ambient AI config. Behavioral no-op — the planner is opt-in.
[config.plan]
enabled = false

# --- sugar for the common case: out-of-band service-token exchange, then a CF_Authorization
# cookie. Applied once by the driver right after connect(), before the first goto. Requires a
# browser-pilot build newer than 0.2.1 that exports `mintCfAccessJwt` and
# `Page.setExtraHTTPHeaders`; an older browser-pilot leaves this parsed but un-applied.
[config.auth.cf_access]
url = "https://app.example.com"                 # your real Access-protected origin
client_id_env = "CF_ACCESS_CLIENT_ID"            # env var NAME, never a value
client_secret_env = "CF_ACCESS_CLIENT_SECRET"
mode = "cookie"                                  # "cookie" (default) | "headers"

# --- generic escape hatches below are usable standalone, without cf_access; kept here only to
# show the shape. Uncomment to exercise them explicitly instead of/alongside cf_access.
# [config.auth.extra_headers.from_env]
# "CF-Access-Client-Id" = "CF_ACCESS_CLIENT_ID"
# "CF-Access-Client-Secret" = "CF_ACCESS_CLIENT_SECRET"
#
# [[config.auth.cookies]]
# name = "CF_Authorization"
# value_from_env = "CF_ACCESS_JWT"
# domain = "app.example.com"

[[steps]]
id = "open_wizard"
do = "goto"
url = "${inputs.base_url}/wizard"

[[steps.assert]]
type = "visible"
text = "Full name"

[[steps]]
id = "enter_name"
do = "fill"
effect = "at_most_once"
target = ["[data-testid='wizard-name']", "the full name field"]
value = "${inputs.full_name}"

[[steps.assert]]
type = "value"
selector = "[data-testid='wizard-name']"
value = "${inputs.full_name}"
