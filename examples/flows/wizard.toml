# Flightplan example flow — the /wizard fixture (target tier: L0/L1).
#
# Multi-step form wizard with clean targets at every tier. Exercises a deterministic
# happy-path resolve + assertion polling. It is reused by the fixture validation runs against
# http://localhost:3000.
#
# Fixture contract: ../fixtures/README.md §01.

version = 1
kind = "flow"
id = "examples.wizard"
description = "Complete the multi-step wizard and assert the welcome result"

[inputs]
base_url = "http://localhost:3000"
full_name = "Jane Doe"
plan = "pro"

[run]
max_steps = 20
assertions = "eager"
assert_timeout_ms = 5000

# Pin the L5 path-repair planner OFF (matches the code default) so deterministic runs stay
# byte-stable regardless of ambient AI config. Behavioral no-op — the planner is opt-in.
[config.plan]
enabled = false

[[steps]]
id = "open_wizard"
do = "goto"
url = "${inputs.base_url}/wizard"

[[steps.assert]]
type = "visible"
text = "Full name"

[[steps]]
id = "enter_name"
do = "fill"
effect = "at_most_once"
target = ["[data-testid='wizard-name']", "the full name field"]
value = "${inputs.full_name}"

[[steps.assert]]
type = "value"
selector = "[data-testid='wizard-name']"
value = "${inputs.full_name}"

[[steps]]
id = "advance_to_plan"
do = "click"
effect = "at_most_once"
# The NL entry is the fuzzy-match query (PLAN §7) — it must point squarely at the "Next" button,
# so we keep it button-name-centric. (A wordy query mentioning "plan" would mis-rank the Plan
# dropdown over Next in the browser accessibility snapshot.)
target = ["[data-testid='wizard-next-1']", "the Next button"]

[[steps.assert]]
type = "visible"
selector = "[data-testid='wizard-plan']"

[[steps]]
id = "choose_plan"
do = "select"
effect = "at_most_once"
target = ["[data-testid='wizard-plan']", "the plan dropdown"]
value = "${inputs.plan}"

[[steps.assert]]
type = "value"
selector = "[data-testid='wizard-plan']"
value = "${inputs.plan}"

[[steps]]
id = "advance_to_review"
do = "click"
effect = "at_most_once"
target = ["[data-testid='wizard-next-2']", "the Next button"]

[[steps.assert]]
type = "visible"
selector = "[data-testid='wizard-submit']"

[[steps]]
id = "submit_wizard"
do = "click"
effect = "at_most_once"
target = ["[data-testid='wizard-submit']", "the Submit button"]

# The result text is surfaced in the page after submit. Assert against the whole-page text
# (no selector) as a simple end-state oracle. A selector-scoped assert would work too:
# deterministic visible/text asserts resolve [data-testid]/CSS on non-interactive nodes via
# the driver's elementState.
[[steps.assert]]
type = "text"
selector = "[data-testid='result']"
match = "exact"
text = "Welcome, ${inputs.full_name}! Plan: ${inputs.plan}."
timeout_ms = 4000
