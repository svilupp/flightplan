# Flightplan example flow — the /gauntlet fixture (target tier: L2).
#
# Three visually/semantically identical "Save" buttons; only a text resolver can pick the
# right one by surrounding context. The flow expresses the target purely as intent (no unique
# selector exists to hint), then asserts the exact result text so a mis-resolve fails loudly.
#
# Fixture contract: ../fixtures/README.md §06.

version = 1
kind = "flow"
id = "examples.gauntlet"
description = "Resolve and save the billing address among identical Save buttons"

[inputs]
base_url = "http://localhost:3000"

[run]
max_steps = 10
assertions = "eager"
assert_timeout_ms = 5000

# Pin the L5 path-repair planner OFF (matches the code default) so deterministic runs stay
# byte-stable regardless of ambient AI config. Behavioral no-op — the planner is opt-in.
[config.plan]
enabled = false

[[steps]]
id = "open_gauntlet"
do = "goto"
url = "${inputs.base_url}/gauntlet"

[[steps.assert]]
type = "visible"
text = "Billing address"

[[steps]]
id = "save_billing_address"
do = "click"
effect = "at_most_once"
target = "the Save button inside the Billing address panel, not the search filters or the draft message"

[[steps.assert]]
type = "visible"
selector = "[data-testid='result']"
timeout_ms = 4000

[[steps.assert]]
type = "text"
selector = "[data-testid='result']"
match = "exact"
text = "Saved billing address"
timeout_ms = 4000
