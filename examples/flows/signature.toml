# Flightplan example flow — the /signature fixture (target tier: L0 sig-mismatch -> L1).
#
# Exercises the lock's page-signature gate (text-hash + structural skeleton) via an env-templated
# variant input, mirroring examples/flows/drift.toml. The target (data-testid="signature-action", "Continue")
# is identical and cleanly resolvable in BOTH variants; only the surrounding copy/structure changes.
# A recipe recorded against variant=same no longer matches variant=changed, so L0 reports a
# signature mismatch and re-resolves at L1 while the assertion still passes. Demonstrates an
# ai_judge assertion PAIRED with a deterministic one (so it is not ai_judge-only).
#
# Fixture contract: ../fixtures/README.md §08.

version = 1
kind = "flow"
id = "examples.signature"
description = "Continue past the signature gate and assert the deterministic result"

[inputs]
base_url = "http://localhost:3000"
variant = "same"

[run]
max_steps = 10
assertions = "eager"
assert_timeout_ms = 5000

[[steps]]
id = "open_signature"
do = "goto"
url = "${inputs.base_url}/signature?variant=${inputs.variant}"

[[steps]]
id = "continue_action"
do = "click"
target = "the Continue button"
hints = ["Continue", "[data-testid='signature-action']"]
intent = "continue past the signature gate using the primary button"

# cont() appends data-testid="result" with text "Continued" — identical across both variants, so the
# assertion is variant-independent; only the resolving tier (L0 hit vs L0 sig-mismatch -> L1) differs.
[[steps.assert]]
type = "visible"
text = "Continued"
timeout_ms = 4000

[[steps.assert]]
type = "text"
text = "Continued"
timeout_ms = 4000

[[steps.assert]]
type = "ai_judge"
inputs = ["screenshot", "text"]
prompt = "The page clearly confirms the user continued past this screen."
