# Flightplan example flow — the /async fixture (target tier: L1 + polling).
#
# Elements render after FIXED delays (700ms banner-on-load, 900ms result-on-click). This flow
# exercises the assertion engine's implicit-wait POLLING: the `visible`/`text` assertions carry a
# `timeout_ms` long enough to cover the fixture delays, so they poll until the late element lands.
# Resolution stays deterministic (L1) — only the assertions wait.
#
# Fixture contract: ../fixtures/README.md §02. Lints clean; runnable against the fixture server
# on http://localhost:3000. With no [connect] block, flightplan attaches to a running Chrome
# over CDP at localhost:9222 (start it with --remote-debugging-port=9222); see the commented
# [connect] override below to self-launch instead.

version = 1
kind = "flow"
id = "examples.async"
description = "Trigger the async action and poll for the late-rendered result"

[inputs]
base_url = "http://localhost:3000"

[run]
max_steps = 20
assertions = "eager"
assert_timeout_ms = 5000

# Pin the L5 path-repair planner OFF (matches the code default) so deterministic runs stay
# byte-stable regardless of ambient AI config. Behavioral no-op — the planner is opt-in.
[config.plan]
enabled = false

# Override the default attach (CDP on localhost:9222) — e.g. have flightplan launch its own
# headless Chrome instead. Only the ENTRY flow's [connect] applies; imports' are ignored.
# [connect]
# mode = "launch"
# headless = true

[[steps]]
id = "open_async"
do = "goto"
url = "${inputs.base_url}/async"

# The banner renders 700ms after load — poll the page text until it appears (timeout covers the
# delay). A page-text assertion is the simplest oracle here; a [data-testid]/CSS selector would
# also work (deterministic asserts resolve non-interactive nodes via the driver's elementState).
[[steps.assert]]
type = "text"
selector = "[data-testid='async-banner']"
text = "Loaded asynchronously"
match = "exact"
timeout_ms = 4000

[[steps]]
id = "trigger_load"
do = "click"
effect = "at_most_once"
target = ["[data-testid='async-load']", "the Load data button"]

# The result renders 900ms after the click — poll the page text until the result lands.
[[steps.assert]]
type = "text"
selector = "[data-testid='result']"
text = "Async action complete"
match = "exact"
timeout_ms = 4000
