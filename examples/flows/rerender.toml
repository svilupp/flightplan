# Flightplan example flow — the /rerender fixture (target tier: L1 + stale-ref re-resolve).
#
# Clicking "Refresh widget" fully REPLACES the #widget-host subtree 600ms later, invalidating any
# cached ref:eN. The "Confirm" button exists ONLY in the re-rendered tree, so acting on it forces
# L1 to take a FRESH snapshot and re-resolve against the new node — exactly the stale-ref path.
# A `wait` step bridges the 600ms replacement before the second click. Resolution stays
# deterministic (L1); the end-state assertion confirms the replacement happened.
#
# Fixture contract: ../fixtures/README.md §03. Lints clean; runnable against the fixture server
# on http://localhost:3000. With no [connect] block, flightplan attaches to a running Chrome
# over CDP at localhost:9222 (start it with --remote-debugging-port=9222).

version = 1
kind = "flow"
id = "examples.rerender"
description = "Refresh the widget, then confirm on the re-rendered (fresh-ref) node"

[inputs]
base_url = "http://localhost:3000"

[run]
max_steps = 20
assertions = "eager"
assert_timeout_ms = 5000

# Pin the L5 path-repair planner OFF (matches the code default) so deterministic runs stay
# byte-stable regardless of ambient AI config. Behavioral no-op — the planner is opt-in.
[config.plan]
enabled = false

[[steps]]
id = "open_rerender"
do = "goto"
url = "${inputs.base_url}/rerender"

# Assert the generation marker against the whole-page text — the simplest oracle here. A
# [data-testid]/CSS selector would also resolve (deterministic asserts hit non-interactive
# nodes via the driver's elementState).
[[steps.assert]]
type = "text"
text = "generation: 1"

[[steps]]
id = "refresh_widget"
do = "click"
effect = "at_most_once"
target = ["[data-testid='rerender-trigger']", "the Refresh widget button"]

# Proves the replacement happened: generation flips to 2 in the brand-new subtree. The assertion
# polls through the fixture's fixed 600ms replacement delay before the next action resolves.
[[steps.assert]]
type = "text"
selector = "[data-testid='rerender-generation']"
text = "generation: 2"
match = "exact"
purpose = "postcondition"
timeout_ms = 4000

[[steps]]
id = "confirm_action"
do = "click"
effect = "at_most_once"
target = ["[data-testid='rerender-action']", "the Confirm button in the refreshed widget"]

[[steps.assert]]
type = "text"
selector = "[data-testid='result']"
text = "Re-rendered action confirmed"
match = "exact"
timeout_ms = 4000
